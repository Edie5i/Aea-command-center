<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEA App — Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">🚗 AEA</div>
        <nav>
            <a href="#dashboard" class="active">📊 Dashboard</a>
            <a href="#leads">📥 Leads</a>
            <a href="#instructores">👨‍🏫 Instructores</a>
            <a href="#calendario">📅 Calendario</a>
            <a href="#pagos">💰 Pagos</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1>Dashboard</h1>
            <span class="badge">Ale: 🟢 Activa</span>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span>📥</span>
                <h3>Leads hoy</h3>
                <p class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <span>✅</span>
                <h3>Cierres</h3>
                <p class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <span>👨‍🏫</span>
                <h3>Instructores activos</h3>
                <p class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <span>💰</span>
                <h3>Ingresos mes</h3>
                <p class="stat-number">$0</p>
            </div>
        </section>
    </main>

    <script src="../shared/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
